<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universal Image Resolution Calculator</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #222;
}

header {
  background: #2563eb;
  color: white;
  padding: 22px 16px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 26px;
}

header p {
  margin: 8px 0 0;
  font-size: 14px;
}

.container {
  max-width: 900px;
  margin: 20px auto;
  padding: 16px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.card h2 {
  margin-top: 0;
  font-size: 20px;
}

input[type="file"] {
  width: 100%;
  padding: 12px;
  border: 2px dashed #2563eb;
  border-radius: 10px;
  background: #f8fbff;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 6px;
}

input[type="number"] {
  width: 100%;
  padding: 12px;
  border: 1px solid #bbb;
  border-radius: 8px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 15px;
  border: none;
  border-radius: 8px;
  background: #2563eb;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #1d4ed8;
}

.result {
  background: #eff6ff;
  padding: 15px;
  border-radius: 10px;
  line-height: 1.8;
}

.preview {
  text-align: center;
}

.preview img {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  margin-top: 12px;
}

.value {
  font-weight: bold;
  color: #1d4ed8;
}

footer {
  text-align: center;
  padding: 25px;
  color: #666;
  font-size: 13px;
}

@media (max-width: 600px) {
  .grid {
    grid-template-columns: 1fr;
  }

  header h1 {
    font-size: 22px;
  }
}
</style>
</head>

<body>

<header>
  <h1>Universal Image Resolution Calculator</h1>
  <p>Calculate Pixels, Inches and DPI easily</p>
</header>

<div class="container">

  <div class="card">
    <h2>1. Upload Your Image</h2>

    <input
      type="file"
      id="imageInput"
      accept="image/*"
    >

    <div class="preview">
      <img id="previewImage" style="display:none;">
    </div>
  </div>

  <div class="card">
    <h2>2. Image Information</h2>

    <div class="grid">

      <div>
        <label>Width (Pixels)</label>
        <input type="number" id="width" placeholder="Example: 4080">
      </div>

      <div>
        <label>Height (Pixels)</label>
        <input type="number" id="height" placeholder="Example: 4080">
      </div>

      <div>
        <label>DPI</label>
        <input type="number" id="dpi" value="300">
      </div>

      <div>
        <label>Target Width (Inches)</label>
        <input type="number" id="targetWidth" step="0.01" placeholder="Example: 6.8">
      </div>

      <div>
        <label>Target Height (Inches)</label>
        <input type="number" id="targetHeight" step="0.01" placeholder="Example: 9.3">
      </div>

    </div>

    <button onclick="calculateResolution()">
      Calculate Resolution
    </button>
  </div>

  <div class="card">
    <h2>3. Results</h2>

    <div class="result">

      <div>
        Current Resolution:
        <span class="value" id="currentResolution">—</span>
      </div>

      <div>
        Current Print Size:
        <span class="value" id="currentPrintSize">—</span>
      </div>

      <div>
        Recommended Pixels:
        <span class="value" id="recommendedPixels">—</span>
      </div>

      <div>
        Total Pixels:
        <span class="value" id="totalPixels">—</span>
      </div>

      <div>
        Megapixels:
        <span class="value" id="megapixels">—</span>
      </div>

    </div>
  </div>

</div>

<footer>
  Universal Image Resolution Calculator © 2026
</footer>

<script>

const imageInput = document.getElementById("imageInput");

imageInput.addEventListener("change", function(event) {

  const file = event.target.files[0];

  if (!file) return;

  const image = new Image();

  image.onload = function() {

    document.getElementById("width").value = image.width;
    document.getElementById("height").value = image.height;

    const preview = document.getElementById("previewImage");

    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";

    calculateResolution();
  };

  image.src = URL.createObjectURL(file);

});


function calculateResolution() {

  const width = Number(document.getElementById("width").value);
  const height = Number(document.getElementById("height").value);
  const dpi = Number(document.getElementById("dpi").value);

  const targetWidth =
    Number(document.getElementById("targetWidth").value);

  const targetHeight =
    Number(document.getElementById("targetHeight").value);

  if (!width || !height || !dpi) {

    alert("Please enter Width, Height and DPI.");

    return;
  }

  document.getElementById("currentResolution").textContent =
    width + " × " + height + " px";

  const printWidth = width / dpi;
  const printHeight = height / dpi;

  document.getElementById("currentPrintSize").textContent =
    printWidth.toFixed(2) +
    " × " +
    printHeight.toFixed(2) +
    " inches";

  const totalPixels = width * height;

  document.getElementById("totalPixels").textContent =
    totalPixels.toLocaleString();

  document.getElementById("megapixels").textContent =
    (totalPixels / 1000000).toFixed(2) + " MP";

  if (targetWidth && targetHeight) {

    const recommendedWidth =
      Math.round(targetWidth * dpi);

    const recommendedHeight =
      Math.round(targetHeight * dpi);

    document.getElementById("recommendedPixels").textContent =
      recommendedWidth +
      " × " +
      recommendedHeight +
      " px";

  } else {

    document.getElementById("recommendedPixels").textContent =
      "Enter target size";

  }

}// Resize and Download feature
function resizeAndDownload() {
  const targetWidth = Math.round(
    Number(document.getElementById("targetWidth").value) *
    Number(document.getElementById("dpi").value)
  );

  const targetHeight = Math.round(
    Number(document.getElementById("targetHeight").value) *
    Number(document.getElementById("dpi").value)
  );

  const preview = document.getElementById("previewImage");

  if (!preview || !preview.src) {
    alert("Please upload an image first.");
    return;
  }

  if (!targetWidth || !targetHeight) {
    alert("Please enter target width, height and DPI.");
    return;
  }

  const canvas = document.createElement("canvas");
  canvas.width = targetWidth;
  canvas.height = targetHeight;

  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";

  ctx.drawImage(preview, 0, 0, targetWidth, targetHeight);

  canvas.toBlob(function(blob) {
    const link = document.createElement("a");
    link.download = "resized-image-" + targetWidth + "x" + targetHeight + ".png";
    link.href = URL.createObjectURL(blob);
    link.click();
    URL.revokeObjectURL(link.href);
  }, "image/png");
}

const resizeButton = document.createElement("button");
resizeButton.textContent = "Resize & Download Image";
resizeButton.type = "button";
resizeButton.style.cssText =
  "display:block;width:100%;padding:14px;margin:15px 0;" +
  "background:#198754;color:white;border:0;border-radius:8px;" +
  "font-size:16px;font-weight:bold;cursor:pointer;";

resizeButton.onclick = resizeAndDownload;

document.body.appendChild(resizeButton);
  
// Image Quality Check
const qualityButton = document.createElement("button");

qualityButton.textContent = "Check Image Quality";
qualityButton.type = "button";

qualityButton.style.cssText =
"display:block;width:100%;padding:14px;margin:10px 0 15px 0;" +
"background:#6f42c1;color:white;border:0;border-radius:8px;" +
"font-size:16px;font-weight:bold;cursor:pointer;";

qualityButton.onclick = function () {

    const width = Number(document.getElementById("width").value);
    const height = Number(document.getElementById("height").value);
    const dpi = Number(document.getElementById("dpi").value);

    const targetWidth =
        Number(document.getElementById("targetWidth").value);

    const targetHeight =
        Number(document.getElementById("targetHeight").value);

    if (!width || !height || !dpi) {
        alert("Please upload an image first.");
        return;
    }

    if (!targetWidth || !targetHeight) {
        alert("Please enter target width and height.");
        return;
    }

    const requiredWidth = Math.round(targetWidth * dpi);
    const requiredHeight = Math.round(targetHeight * dpi);

    const widthOK = width >= requiredWidth;
    const heightOK = height >= requiredHeight;

    let message = "IMAGE QUALITY CHECK\n\n";

    message +=
        "Current Image: " + width + " × " + height + " px\n";

    message +=
        "Required Image: " + requiredWidth + " × " +
        requiredHeight + " px\n\n";

    if (widthOK && heightOK) {
        message += "✅ GOOD: Image resolution is sufficient.";
    } else {
        message +=
            "⚠️ LOW: Image resolution is not sufficient for the target size.\n\n";

        if (!widthOK) {
            message += "Width needs improvement.\n";
        }

        if (!heightOK) {
            message += "Height needs improvement.\n";
        }
    }

    alert(message);
};

document.body.appendChild(qualityButton);

  // KDP Size & Aspect Ratio Check
const kdpButton = document.createElement("button");

kdpButton.textContent = "Check KDP Size & Aspect Ratio";
kdpButton.type = "button";

kdpButton.style.cssText =
"display:block;width:100%;padding:14px;margin:10px 0 15px 0;" +
"background:#7e57c2;color:white;border:0;border-radius:8px;" +
"font-size:16px;font-weight:bold;cursor:pointer;";

kdpButton.onclick = function () {

    const width = Number(document.getElementById("width").value);
    const height = Number(document.getElementById("height").value);

    if (!width || !height) {
        alert("Please upload an image first.");
        return;
    }

    // KDP Target: 6.8 × 9.3 inches at 300 DPI
    const KDP_WIDTH = 2040;
    const KDP_HEIGHT = 2790;

    const TARGET_RATIO = KDP_WIDTH / KDP_HEIGHT;
    const currentRatio = width / height;

    const ratioDifference =
        Math.abs(currentRatio - TARGET_RATIO) / TARGET_RATIO * 100;

    let message = "KDP SIZE & ASPECT RATIO CHECK\n\n";

    message +=
        "Required Size: 2040 × 2790 px\n" +
        "Target Print Size: 6.8 × 9.3 inches\n" +
        "Required Resolution: 300 DPI\n\n";

    message +=
        "Current Image: " + width + " × " + height + " px\n" +
        "Current Aspect Ratio: " + currentRatio.toFixed(4) + "\n" +
        "Required Aspect Ratio: " + TARGET_RATIO.toFixed(4) + "\n\n";

    const sizeOK = width === KDP_WIDTH && height === KDP_HEIGHT;
    const ratioOK = ratioDifference <= 1;

    if (sizeOK && ratioOK) {

        message +=
            "✅ PERFECT!\n" +
            "Image is exactly 2040 × 2790 px.\n" +
            "Aspect ratio is correct.\n" +
            "Ready for 6.8 × 9.3 inch KDP page at 300 DPI.";

    } else {

        message += "⚠️ CHECK REQUIRED\n\n";

        if (!sizeOK) {
            message +=
                "Required pixels: 2040 × 2790 px\n" +
                "Your pixels: " + width + " × " + height + " px\n\n";
        }

        if (!ratioOK) {
            message +=
                "⚠️ Aspect ratio does not match 6.8 × 9.3.\n" +
                "Cropping or resizing may be required.";
        }
    }

    alert(message);
};

document.body.appendChild(kdpButton);
  // KDP Safe Resize 6.8 x 9.3
const safeResizeButton = document.createElement("button");

safeResizeButton.textContent = "KDP Safe Resize (6.8 × 9.3)";
safeResizeButton.type = "button";

safeResizeButton.style.cssText =
"display:block;width:100%;padding:14px;margin:10px 0 15px 0;" +
"background:#0b8f55;color:white;border:0;border-radius:8px;" +
"font-size:16px;font-weight:bold;cursor:pointer;";

safeResizeButton.onclick = function () {

    const preview = document.getElementById("previewImage");

    if (!preview || !preview.src) {
        alert("Please upload an image first.");
        return;
    }

    const KDP_WIDTH = 2040;
    const KDP_HEIGHT = 2790;

    const img = new Image();

    img.onload = function () {

        const canvas = document.createElement("canvas");

        canvas.width = KDP_WIDTH;
        canvas.height = KDP_HEIGHT;

        const ctx = canvas.getContext("2d");

        // White background
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, KDP_WIDTH, KDP_HEIGHT);

        // Preserve original aspect ratio
        const scale = Math.min(
            KDP_WIDTH / img.width,
            KDP_HEIGHT / img.height
        );

        const newWidth = Math.round(img.width * scale);
        const newHeight = Math.round(img.height * scale);

        // Center image
        const x = Math.round((KDP_WIDTH - newWidth) / 2);
        const y = Math.round((KDP_HEIGHT - newHeight) / 2);

        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";

        ctx.drawImage(
            img,
            x,
            y,
            newWidth,
            newHeight
        );

        canvas.toBlob(function (blob) {

            if (!blob) {
                alert("Error creating PNG file.");
                return;
            }

            const link = document.createElement("a");

            const originalName = preview.files?.[0]?.name || "image.png";
const baseName = originalName.replace(/\.[^/.]+$/, "");
link.download = baseName + "-KDP-2040x2790.png";
            link.href = URL.createObjectURL(blob);

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            setTimeout(function () {
                URL.revokeObjectURL(link.href);
            }, 1000);

            alert(
                "KDP SAFE RESIZE COMPLETE!\n\n" +
                "Final Pixel Size: 2040 × 2790 px\n" +
                "Target Size: 6.8 × 9.3 inches\n" +
                "Format: PNG\n" +
                "Aspect Ratio: Preserved\n" +
                "No stretching or distortion."
            );

        }, "image/png");
    };

    img.onerror = function () {
        alert("Unable to load the image.");
    };

    img.src = preview.src;
};

document.body.appendChild(safeResizeButton);
  const finalCheckButton = document.createElement("button");
finalCheckButton.textContent = "KDP FINAL CHECK";
finalCheckButton.style.background = "#198754";

finalCheckButton.onclick = function () {

    const requiredWidth = 2040;
    const requiredHeight = 2790;

    const checkImage = document.querySelector('img');
const width = checkImage.naturalWidth || checkImage.width;
const height = checkImage.naturalHeight || checkImage.height;

    const aspect = (width / height).toFixed(4);
    const requiredAspect = (requiredWidth / requiredHeight).toFixed(4);

    if (width === requiredWidth && height === requiredHeight) {

        alert(
            "KDP FINAL CHECK ✅\n\n" +
            "Pixel Size: " + width + " × " + height + " px\n" +
            "Print Size: 6.8 × 9.3 inches\n" +
            "Target DPI: 300\n" +
            "Aspect Ratio: " + aspect + "\n\n" +
            "STATUS: KDP READY ✅"
        );

    } else {

        alert(
            "KDP FINAL CHECK ⚠️\n\n" +
            "Current Pixel Size: " + width + " × " + height + " px\n" +
            "Required Pixel Size: " +
            requiredWidth + " × " + requiredHeight + " px\n" +
            "Current Aspect Ratio: " + aspect + "\n" +
            "Required Aspect Ratio: " + requiredAspect + "\n\n" +
            "STATUS: NOT KDP READY ❌\n\n" +
            "Please use KDP SAFE RESIZE first."
        );
    }
};

document.body.appendChild(finalCheckButton);
</script>

</body>
  </html>
